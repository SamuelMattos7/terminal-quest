pid /tmp/nginx.pid;
error_log stderr;
events {}
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 80;
        add_header X-Penguin-Service intranet always;
        location = / {
            default_type text/html;
            root /srv/intranet;
            index index.html;
        }
        location = /index.html {
            default_type text/html;
            root /srv/intranet;
        }
        location = /status {
            default_type application/json;
            return 200 '{"service":"intranet","status":"ok"}\n';
        }
        location = /api/users {
            default_type application/json;
            return 200 '[{"name":"Tux","role":"operator"}]\n';
        }
        location / {
            default_type application/json;
            return 404 '{"error":"not found"}\n';
        }
    }
}

id: w4-14-systemd-units
world: 4
order: 14
title: Units of Work
kind: lesson
difficulty: 3
estimated_minutes: 12
story: |
  Tux-9000: "The Engine Room needs its report at midnight UTC. Create
  report.service and report.timer in /etc/systemd/system. Run the
  service once to inspect its journal, then set the timer running and
  enable it. Sleeping through the next midnight is optional."
teaches: [systemd]
par_commands: 8
xp: 130
requires: systemd-shim
sandbox:
  profile: admin
  needs_cron: false
setup:
  files:
    - path: /usr/local/bin/report.sh
      owner: root
      mode: '755'
      content_file: setup/report.sh
objectives:
  - id: load-report-service
    text: 'Load report.service as a simple player service that runs /usr/local/bin/report.sh.'
    check:
      type: exec
      inline: |
        set -e
        state=$(/opt/tq/bin/systemctl status report.service)
        grep -Fxq 'User: player' <<< "$state"
        grep -Fxq 'ExecStart: /usr/local/bin/report.sh' <<< "$state"
  - id: run-and-inspect-report
    text: 'Start report.service once and inspect its output with journalctl -u report.service.'
    check:
      type: exec
      inline: /opt/tq/bin/journalctl -u report.service | grep -Fxq 'Engine Room report generated by player.'
  - id: schedule-daily-report
    text: 'Load, start, and enable report.timer so it activates report.service daily at midnight UTC.'
    check:
      type: exec
      inline: |
        set -e
        state=$(/opt/tq/bin/systemctl status report.timer)
        grep -Fxq 'Loaded: loaded (enabled)' <<< "$state"
        grep -Fxq 'Active: active (waiting)' <<< "$state"
        grep -Fxq 'Triggers: report.service' <<< "$state"
        grep -Fxq -e 'OnCalendar: daily' -e 'OnCalendar: *-*-* 00:00:00' <<< "$state"
hints:
  - 'The service describes what to run. The timer describes when to run it. Files with the same name before their suffix can be paired automatically.'
  - 'Use [Service] with Type=simple, User=player, and ExecStart. Use [Timer] with OnCalendar=daily. Run systemctl daemon-reload after saving.'
  - 'Run systemctl start report.service, then journalctl -u report.service. Run systemctl start report.timer and systemctl enable report.timer. Inspect it with systemctl list-timers.'
explain:
  - command: systemctl daemon-reload
    parts:
      - { token: daemon-reload, meaning: 'load the current unit files after editing them' }
  - command: systemctl start report.timer
    parts:
      - { token: start, meaning: 'activate the timer and schedule its next run' }
  - command: systemctl enable report.timer
    parts:
      - { token: enable, meaning: 'record the unit as enabled independently of its running state' }
  - command: journalctl -u report.service
    parts:
      - { token: '-u report.service', meaning: 'show the captured output of that service' }
cheatsheet:
  - { skill: systemd, syntax: 'systemctl daemon-reload', note: 'Reload changed unit files.' }
  - {
      skill: systemd,
      syntax: 'systemctl list-timers',
      note: 'Inspect active timers and their next runs.',
    }
  - { skill: systemd, syntax: 'journalctl -u NAME.service', note: 'Read output from a service.' }
success_message: 'Report running on schedule. You may now spend midnight doing something else.'
solutions:
  reference: solution.sh
  wrong: [wrong/hourly.sh]
